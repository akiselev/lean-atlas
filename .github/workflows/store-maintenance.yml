name: Store branch maintenance

on:
  pull_request:

permissions:
  contents: write

jobs:
  maintain:
    if: github.event.pull_request.head.ref == 'agent/store-v3-append-only-ledger' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Refresh lockfile and format
        run: |
          cargo check --workspace --exclude atlas-py
          cargo fmt --all
      - name: Commit maintenance changes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/atlas-store
          git commit -m "style: refresh store lockfile and formatting"
          git push origin "HEAD:${{ github.head_ref }}"
