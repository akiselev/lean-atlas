name: Rust

on:
  push:
    branches: [master, "agent/**"]
  pull_request:

permissions:
  contents: write

jobs:
  atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Dependency layering
        run: python scripts/check-deps.py
      - name: Test v2 workspace
        run: cargo test --workspace --exclude atlas-py
      - name: Check Python binding crate
        run: cargo check -p atlas-py
      - name: Materialize generated Rust state
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if ! git diff --quiet -- Cargo.lock crates; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Cargo.lock crates
            git commit -m 'build: materialize M5 lockfile and rustfmt output'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Format
        run: cargo fmt --all -- --check
