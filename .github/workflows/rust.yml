name: Rust

on:
  push:
    branches: [master, "agent/**"]
  pull_request:

permissions:
  contents: write

jobs:
  atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Test Atlas engine
        run: cargo test -p atlas
      - name: Format branch once
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/intuition-engine'
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add crates/atlas/src/intuition_viewpoint.rs crates/atlas/src/intuition_concept.rs crates/atlas/src/intuition_benchmark.rs crates/atlas/src/lib.rs
            git commit -m "format extended intuition modules"
            git push
          fi
      - name: Format check
        run: cargo fmt --all -- --check
