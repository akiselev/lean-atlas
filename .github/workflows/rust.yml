name: Rust

on:
  push:
    branches: [master, "agent/**"]
  pull_request:

jobs:
  atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Dependency layering
        run: python scripts/check-deps.py
      - name: Test v2 workspace
        run: cargo test --workspace --exclude atlas-py
      - name: Check Python binding crate
        run: cargo check -p atlas-py
      - name: Capture resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: m5-cargo-lock
          path: Cargo.lock
      - name: Format
        run: cargo fmt --all -- --check
