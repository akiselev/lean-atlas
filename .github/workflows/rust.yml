name: Rust

on:
  push:
    branches: [master, "agent/**"]
  pull_request:

permissions:
  contents: write

jobs:
  atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Test Atlas engine
        run: cargo test -p atlas
      - name: Clean and format branch once
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/intuition-engine'
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('crates/atlas/src/intuition_concept.rs')
          s = p.read_text()
          s = s.replace('use std::collections::{BTreeMap, BTreeSet};', 'use std::collections::BTreeSet;')
          s = re.sub(r'\npub const ALL_AFFORDANCES: \[Affordance; 36\] = \[.*?\n\];\n\n/// One exact formal concept', '\n/// One exact formal concept', s, count=1, flags=re.S)
          p.write_text(s)
          PY
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add crates/atlas/src/bin/atlas-intuition.rs crates/atlas/src/intuition_concept.rs
            git commit -m "format advanced intuition CLI"
            git push
          fi
      - name: Format check
        run: cargo fmt --all -- --check
