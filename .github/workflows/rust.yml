name: Rust and Lean RPC

on:
  push:
    branches: [master, "agent/**"]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Test Atlas workspace foundations
        run: >-
          cargo test
          -p atlas-schema
          -p atlas-store
          -p atlas-logic
          -p atlas-lean-protocol
          -p atlas-lean-client
          -p atlas
      - name: Format
        run: cargo fmt --all -- --check

  lean-rpc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean-server
          build: true
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Smoke live Lean RPC transport and expression handles
        shell: bash
        run: |
          build="$PWD/lean-server/.lake/build"
          plugin="$(bash lean-server/prepare-plugin.sh "$build" "$RUNNER_TEMP/atlas-plugin")"
          echo "Using Atlas Lean plugin: $plugin"
          python3 scripts/lean-rpc-smoke.py "$plugin"
