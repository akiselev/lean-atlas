name: Lean server

on:
  push:
    branches: [master, "agent/**"]
  pull_request:

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install elan
        run: curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
      - name: Build Atlas server plugin
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          cd lean-server
          lake build AtlasServer:shared
      - name: Locate shared plugin
        id: plugin
        shell: bash
        run: |
          set -euo pipefail
          plugin="$(find lean-server/.lake/build -type f \( \
            -name 'libatlasServer_Atlas_Server_Plugin.so' -o \
            -name 'libatlasServer_Atlas_Server_Plugin.dylib' -o \
            -name 'atlasServer_Atlas_Server_Plugin.dll' -o \
            -name 'libatlasServer_Atlas_Server_Plugin.dll' \
          \) -print -quit)"
          if [[ -z "$plugin" ]]; then
            echo "Atlas.Server.Plugin shared target not found. Dynamic-library candidates:" >&2
            find lean-server/.lake/build -type f \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' \) -print >&2
            exit 1
          fi
          plugin="$(realpath "$plugin")"
          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"
          echo "Atlas server plugin: $plugin"
      - name: Live native RPC smoke
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          python3 lean-server/tests/rpc_smoke.py "$(command -v lean)" "${{ steps.plugin.outputs.plugin }}"
      - name: Live typed Rust client smoke
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          workdir="$(realpath lean-server)"
          fixture="$(realpath lean-server/Fixtures/RpcSmoke.lean)"
          root_uri="$(python3 -c 'import pathlib; print(pathlib.Path("lean-server").resolve().as_uri())')"
          fixture_uri="$(python3 -c 'import pathlib; print(pathlib.Path("lean-server/Fixtures/RpcSmoke.lean").resolve().as_uri())')"
          ATLAS_RUN_LIVE_LEAN_RPC=1 \
          ATLAS_LEAN_BIN="$(command -v lean)" \
          ATLAS_LEAN_PLUGIN="${{ steps.plugin.outputs.plugin }}" \
          ATLAS_LEAN_FIXTURE="$fixture" \
          ATLAS_LEAN_WORKDIR="$workdir" \
          ATLAS_LEAN_ROOT_URI="$root_uri" \
          ATLAS_LEAN_FIXTURE_URI="$fixture_uri" \
            cargo test -p atlas-lean-client --test live_rpc -- --nocapture
      - name: Live atlasd M5 lifecycle smoke
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cargo build -p atlasd -p atlas-cli -p atlas-mcp
          export ATLASD_BIN="$(realpath target/debug/atlasd)"
          export ATLAS_LEAN_BIN="$(command -v lean)"
          export ATLAS_LEAN_PLUGIN="${{ steps.plugin.outputs.plugin }}"
          export ATLAS_LEAN_ROOT_URI="$(python3 -c 'import pathlib; print(pathlib.Path("lean-server").resolve().as_uri())')"
          export ATLAS_M5_CLI="$(realpath target/debug/atlas-cli)"
          export ATLAS_M5_MCP="$(realpath target/debug/atlas-mcp)"
          export ATLAS_M5_ROOT="$(realpath lean-server)"
          export ATLAS_M5_FIXTURE="$(realpath lean-server/Fixtures/RpcSmoke.lean)"
          export ATLAS_M5_FIXTURE_URI="$(python3 -c 'import pathlib; print(pathlib.Path("lean-server/Fixtures/RpcSmoke.lean").resolve().as_uri())')"
          python3 scripts/m5-atlasd-smoke.py
      - name: Live atlasd M6 semantic query smoke
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cargo build -p atlasd -p atlas-cli -p atlas-mcp
          export ATLASD_BIN="$(realpath target/debug/atlasd)"
          export ATLAS_LEAN_BIN="$(command -v lean)"
          export ATLAS_LEAN_PLUGIN="${{ steps.plugin.outputs.plugin }}"
          export ATLAS_LEAN_ROOT_URI="$(python3 -c 'import pathlib; print(pathlib.Path("lean-server").resolve().as_uri())')"
          export ATLAS_QUERY_LINE=8
          export ATLAS_QUERY_CHARACTER=0
          export ATLAS_M6_CLI="$(realpath target/debug/atlas-cli)"
          export ATLAS_M6_MCP="$(realpath target/debug/atlas-mcp)"
          export ATLAS_M6_ROOT="$(realpath lean-server)"
          export ATLAS_M6_FIXTURE="$(realpath lean-server/Fixtures/RpcSmoke.lean)"
          export ATLAS_M6_FIXTURE_URI="$(python3 -c 'import pathlib; print(pathlib.Path("lean-server/Fixtures/RpcSmoke.lean").resolve().as_uri())')"
          python3 scripts/m6-query-smoke.py
