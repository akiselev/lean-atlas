name: Lean server

on:
  push:
    branches: [master, "agent/**"]
  pull_request:

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
      - name: Build Atlas server plugin
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          cd lean-server
          lake build AtlasServer:shared
      - name: Locate shared plugin
        id: plugin
        shell: bash
        run: |
          set -euo pipefail
          plugin="$(find lean-server/.lake/build -type f \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' \) -print | grep 'AtlasServer' | head -n1 || true)"
          if [[ -z "$plugin" ]]; then
            echo "AtlasServer shared target not found. Dynamic-library candidates:" >&2
            find lean-server/.lake/build -type f \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' \) -print >&2
            exit 1
          fi
          plugin="$(realpath "$plugin")"
          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"
          echo "Atlas server plugin: $plugin"
      - name: Live native RPC smoke
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          python3 lean-server/tests/rpc_smoke.py "$(command -v lean)" "${{ steps.plugin.outputs.plugin }}"
