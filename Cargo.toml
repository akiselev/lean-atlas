[workspace]
resolver = "2"
members = [
    "crates/atlas-schema",
    "crates/atlas-store",
    "crates/atlas-logic",
    "crates/atlas-lean-protocol",
    "crates/atlas-lean-client",
    "crates/atlas",
    "crates/atlas-py",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
