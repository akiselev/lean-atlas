[package]
name = "atlas-py"
description = "Python bindings for the Atlas core (research/python-api.md §2, `fa.Corpus`)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "atlas"
crate-type = ["cdylib"]
# No Rust test harness: an `extension-module` cdylib has undefined Python symbols by
# design, so linking a test binary against it fails. The tests are Python — tests/smoke.py.
test = false
doctest = false

[dependencies]
atlas = { path = "../atlas" }
pyo3 = { version = "0.29", features = ["abi3-py310"] }

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]
